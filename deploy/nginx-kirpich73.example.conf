# Пример: второй сайт на том же IP по порту 8080 (основной сайт остаётся на :80).
# Скопируйте в sites-available, поправьте пути, проверьте: nginx -t && systemctl reload nginx
#
# upstream — Node слушает PORT из ecosystem (по умолчанию 3001)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
